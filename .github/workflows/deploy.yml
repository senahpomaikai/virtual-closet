name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Credentials come from a scoped IAM user — write access to this one S3 prefix
      # and invalidation rights on this one distribution, nothing else.
      # See docs/deploy-iam-policy.json for the exact policy.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Asset filenames carry a content hash, so they can be cached forever.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/ s3://is-551/virtual-closet/ --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      # index.html is the one file that must never be served stale.
      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html s3://is-551/virtual-closet/index.html \
            --cache-control "no-cache"

      # CloudFront caches hard; without this, updates can take hours to appear.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EXVKNEI606DCF \
            --paths "/virtual-closet/*"
